plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 36
        versionCode 21
        versionName '0.8.3-L'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            ['instaeclipse.ffmpeg', 'instaeclipse.ffprobe', 'instaeclipse.fixtureOutput'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
    packagingOptions {
        resources {
            // The patcher's apkzlib / Bouncy Castle / Guava dependencies ship duplicate metadata.
            excludes += [
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                    'META-INF/DEPENDENCIES',
                    'META-INF/INDEX.LIST',
                    'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/LICENSE.md',
                    'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE.md',
                    'META-INF/*.kotlin_module'
            ]
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation libs.osmdroid

    // External library for shared preferences
    implementation libs.fileprefs

    // No-root Instagram patcher: bundled zip/sign (apkzlib) and binary-manifest editor libraries,
    // plus apkzlib's runtime dependencies (apksig for v2 signing, guava, Bouncy Castle).
    implementation files('libs/apkzlib.jar')
    implementation files('libs/ManifestEditor-1.0.2.jar')
    implementation 'com.android.tools.build:apksig:8.7.0'
    implementation 'com.google.guava:guava:33.4.0-android'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // Testing dependencies
    testImplementation libs.junit
    testRuntimeOnly files('libs/api-82.jar')
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    // Compile-only dependency
    compileOnly files('libs/api-82.jar')
}
