plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 37

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 36
        versionCode 19
        versionName '0.8.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            ['instaeclipse.ffmpeg', 'instaeclipse.ffprobe', 'instaeclipse.fixtureOutput'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/*.version',
                'DebugProbesKt.bin',
                '/META-INF/INDEX.LIST'
            ]
        }
    }

}

dependencies {
    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material3.windowSizeClass
    implementation libs.compose.material.icons.extended
    implementation libs.compose.animation
    implementation libs.activity.compose
    implementation libs.lifecycle.compose
    debugImplementation libs.compose.ui.tooling

    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.dexkit
    implementation libs.gson
    implementation libs.documentfile
    implementation libs.coroutines.android
    implementation libs.osmdroid

    // Testing dependencies
    testImplementation libs.junit
    testRuntimeOnly files('libs/api-82.jar')
    testImplementation libs.coroutines.test
    testImplementation libs.json
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    // Compile-only dependency
    compileOnly files('libs/api-82.jar')
}
