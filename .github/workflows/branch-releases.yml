name: Branch Releases

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  delete:

permissions:
  contents: write

jobs:
  cleanup-deleted-branch:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag for deleted branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: release-${{ github.event.ref }}
        run: |
          echo "Verifica esistenza release per il tag: $TAG_NAME"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Eliminazione release: $TAG_NAME"
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          else
            echo "Nessuna release trovata per $TAG_NAME"
          fi

  build-and-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Release/Assemble)
        run: ./gradlew assemble

      - name: Find and stage APK asset
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Trovato APK: $APK_PATH"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "Nessun APK generato."
            echo "apk_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update branch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          TAG_NAME: release-${{ github.ref_name }}
          SHA: ${{ github.sha }}
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          # 1. Rimuove la release esistente e il relativo tag
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Aggiornamento release esistente: $TAG_NAME"
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          fi

          # 2. Prepara gli argomenti degli asset
          ASSET_ARGS=()
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            ASSET_ARGS+=("$APK_PATH")
          fi

          # 3. Ricrea la release associata al branch e al commit corrente
          gh release create "$TAG_NAME" \
            "${ASSET_ARGS[@]}" \
            --target "$SHA" \
            --title "Build: $BRANCH_NAME" \
            --notes "Ultimo aggiornamento per il branch \`$BRANCH_NAME\` al commit \`$SHA\`." \
            --prerelease
